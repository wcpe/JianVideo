packages:
  # 生产主端 apps/web 使用 npm + package-lock（含 mpegts 等），不入 pnpm workspace。
  - 'apps/*'
  - '!apps/web'
  - '!apps/server'
  - packages/*
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
# 仅钉受影响的 brace-expansion 5.x（<=5.0.7），不覆盖 minimatch@9 使用的 2.x。
overrides:
  'brace-expansion@5': 5.0.8
  # react-router 安全修复：RSC CSRF GHSA-qwww-vcr4-c8h2（patched >=8.3.0）
  react-router: 8.3.0
