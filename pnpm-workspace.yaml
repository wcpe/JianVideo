packages:
  # 生产主端 apps/web 使用 npm + package-lock（含 mpegts 等），不入 pnpm workspace。
  - 'apps/*'
  - '!apps/web'
  - '!apps/server'
  - packages/*
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
# 钉死 brace-expansion 安全版本，消除 audit high（GHSA-mh99-v99m-4gvg）
# 仅覆盖受影响的 5.x 线（<=5.0.7），不强制 2.x 升主版本以免破坏 minimatch@9
overrides:
  'brace-expansion@<=5.0.7': 5.0.8
  react-router: 8.3.0
