# 推送稳定 tag（vX.Y.Z）后自动质量门、构建并公开正式 Release。
name: 发布稳定版本

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: 校验 GA 发布元数据
    runs-on: ubuntu-24.04
    # 排除 RC tag，避免与 rc.yml 重复触发
    if: ${{ !contains(github.ref_name, '-rc.') }}
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      artifact_prefix: ${{ steps.meta.outputs.artifact_prefix }}
    steps:
      - name: 检出固定源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: meta
        name: 读取并校验 GA 版本与 tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "错误：GA 的 VERSION 必须是稳定版 X.Y.Z。" >&2; exit 1; }
          [ "$REF_NAME" = "v$version" ] || { echo "错误：推送的 tag（$REF_NAME）必须等于 v$version。" >&2; exit 1; }
          source_sha="$(git rev-parse HEAD)"
          # 正式 tag 必须落在 main 历史（FR2-014：main 唯一发布分支）。
          # 浅克隆/缺 ref 时补抓 main；若不在 main 可达历史则拒绝发布。
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "错误：正式 tag 的提交 $source_sha 不在 origin/main 历史中。请先把可发布提交合入 main，再在 main 上打 tag。" >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=jianvideo-ga-${source_sha:0:7}" >> "$GITHUB_OUTPUT"
      - name: 预检目标 GA Release 不存在
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/publish-release.sh preflight-release "${{ steps.meta.outputs.tag }}"
      - name: 校验 GA 发布说明
        shell: bash
        run: bash scripts/changelog-extract.sh "${{ steps.meta.outputs.version }}" CHANGELOG.md >/dev/null

  quality:
    name: 复用四项质量门
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}

  build:
    name: 构建固定 GA 源码
    needs: [prepare, quality]
    if: ${{ needs.prepare.result == 'success' && needs.quality.result == 'success' }}
    uses: ./.github/workflows/build.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      artifact_prefix: ${{ needs.prepare.outputs.artifact_prefix }}
      artifact_retention_days: 7

  publish:
    name: 安全发布 GA
    needs: [prepare, quality, build]
    if: ${{ needs.prepare.result == 'success' && needs.quality.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出发布脚本与变更日志
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - name: 下载全部平台工件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ${{ needs.prepare.outputs.artifact_prefix }}-*
          path: artifacts
          merge-multiple: true
      - name: 生成 GA 发布说明
        shell: bash
        run: bash scripts/changelog-extract.sh "${{ needs.prepare.outputs.version }}" CHANGELOG.md > release-notes.md
      - name: 校验并公开 GA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/publish-release.sh publish-from-tag artifacts "${{ needs.prepare.outputs.tag }}" "${{ needs.prepare.outputs.source_sha }}" ga release-notes.md
