# 预发布工作流（FR-48）。
# 触发：普通代码 push 到 main（排除 VERSION/文档/工作流变更，那些走正式发布或无需出包）——
# 经可复用 build.yml 多平台原生构建，滚动刷新 dev 预发布（prerelease），便于试用最新主干。
name: 预发布

on:
  push:
    branches: [main]
    paths-ignore: ['VERSION', '**.md', 'docs/**', '.github/**']
  workflow_dispatch:

# 创建/更新预发布与滚动 dev tag 需要写权限。
permissions:
  contents: write

jobs:
  # 预发布版本号 = max(最新正式版 tag, VERSION 文件) 的下一修订号 + dev + 短 SHA（FIX-3）。
  # 取 tag 与 VERSION 中较高者自增：既保证 dev 始终领先于上个正式版（不倒挂），
  # 又不因版本 tag 未推送到远端而偏低（dev 跟随 VERSION 文件，解耦 tag 推送时机）。
  # 推导逻辑收敛到 scripts/dev-version.sh（带本地测试 scripts/dev-version_test.sh），CI 与本地一致。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 取全部 tag 供 git describe 推导（默认浅克隆无 tag）。
          fetch-depth: 0
      - id: ver
        name: 生成预发布版本号（max(最新正式版 tag, VERSION) 的下一修订号 + dev + 短 SHA）
        run: |
          base="$(bash scripts/dev-version.sh)"
          echo "version=${base}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # 复用构建工作流产出各平台二进制工件。
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  # 汇总工件，删除旧 dev 预发布后重建（滚动指向最新主干）。
  prerelease:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载全部平台工件
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总产物与校验和
        run: |
          mkdir -p release
          find artifacts -type f -name 'jianvideo-*-amd64*' ! -name '*.sha256' -exec cp {} release/ \;
          cat artifacts/*/jianvideo-*-amd64.sha256 > release/checksums.txt
      - name: 生成预发布说明（开发预览提示 + CHANGELOG 未发布段）
        env:
          PRE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # 从 CHANGELOG 抽取「## 未发布」段内容（与正式发布共用同一抽取脚本，行为一致）。
          # 注意：CHANGELOG 实际标题是「## 未发布」（无「版本」二字），脚本据实匹配，修复此前抽空 bug。
          notes="$(bash scripts/changelog-extract.sh unreleased CHANGELOG.md)"
          {
            echo "> ⚠️ 这是**滚动开发预览**，由 main 分支最新提交自动构建，可能不稳定，仅供尝鲜测试。正式使用请选「正式版」频道。"
            echo ""
            echo "- 版本：\`${PRE_VERSION}\`"
            echo "- 提交：\`${GITHUB_SHA}\`"
            echo ""
            echo "## 自上个正式版以来的变更（CHANGELOG · 未发布）"
            echo ""
            if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$notes"
            else
              echo "_（暂无记录）_"
            fi
          } > release-notes.md
      - name: 删除旧 dev 预发布（若存在，连同滚动 tag）
        run: gh release delete dev --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 发布 dev 预发布（滚动指向当前主干）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: 开发预览（dev · ${{ needs.prepare.outputs.version }}）
          prerelease: true
          body_path: release-notes.md
          files: release/*
