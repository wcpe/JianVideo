# 统一质量门。日常 PR/main push 与发布工作流复用同一组四项门禁。
name: 质量门

on:
  workflow_call:
    inputs:
      source_sha:
        description: 固定检出并验证的源码提交
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: true

jobs:
  workspace-quality:
    name: 根工作区质量门
    runs-on: ubuntu-24.04
    steps:
      - name: 检出固定源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: 安装工作区依赖
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: 审计工作区生产依赖
        run: pnpm audit --prod --audit-level high
      - name: 运行工作区质量门
        run: pnpm quality:workspace
      - name: 运行发布工作流契约门
        run: pnpm quality:release

  go-quality:
    name: Go 质量门
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"
    steps:
      - name: 检出固定源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: 安装 Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/server/go.mod
      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装媒体测试工具
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 构建内嵌前端
        run: |
          corepack enable
          npm --prefix apps/web install --no-audit --no-fund
          npm --prefix apps/web run build
      - name: 安装 Go 质量工具
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install github.com/go-task/task/v3/cmd/task@v3.40.1
      - name: 运行 Go 质量门
        run: pnpm quality:go

  web-quality:
    name: 独立前端质量门
    runs-on: ubuntu-24.04
    steps:
      - name: 检出固定源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装前端依赖
        run: |
          corepack enable
          npm --prefix apps/web install --no-audit --no-fund
      - name: 审计前端生产依赖
        run: npm --prefix apps/web audit --omit=dev --audit-level=high
      - name: 运行前端质量门
        run: pnpm quality:frontend

  e2e:
    name: Playwright 端到端质量门
    runs-on: ubuntu-24.04
    steps:
      - name: 检出固定源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: 安装 Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/server/go.mod
      - name: 安装媒体测试工具
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装测试依赖
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npm --prefix apps/web install --no-audit --no-fund
      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps chromium
      - name: 运行端到端质量门
        run: pnpm quality:e2e
