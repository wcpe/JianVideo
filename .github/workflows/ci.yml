# 质量门工作流：在 PR 与 push main 时统一执行根工作区、独立前端、Go 与 Playwright 门禁。
# 任一 job 失败即整体失败、阻断合并。发版工作流职责不变（见 ADR-0047 / FR-128）。
# 根工作区使用 pnpm 锁文件；独立前端继续使用 npm install，避免 Windows 生成的 lock
# 缺少 Linux 平台可选依赖时触发 npm ci 严格同步失败。
name: 质量门

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 根工作区门禁：覆盖 apps/* 与 packages/* 的构建、类型、lint、格式、测试、覆盖率与生产依赖审计。
  workspace-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装工作区依赖
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: 审计工作区生产依赖
        run: pnpm audit --prod --audit-level high
      - name: 运行工作区质量门
        run: pnpm quality:workspace

  # Go 门禁依赖 go:embed 的 frontend/dist，先构建前端再执行静态检查、漏洞扫描和覆盖率门。
  go-quality:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Go（按 go.mod 版本）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装 ffmpeg（转码与真实媒体测试依赖）
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 构建前端（供 go:embed 内嵌）
        run: |
          corepack enable
          npm --prefix frontend install
          npm --prefix frontend run build
      - name: 安装 Go 质量工具
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: 运行 Go 质量门
        run: pnpm quality:go

  # 独立前端门禁：覆盖构建、类型、lint、格式、测试、覆盖率与生产依赖审计。
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        run: |
          corepack enable
          npm --prefix frontend install
      - name: 审计前端生产依赖
        run: npm --prefix frontend audit --omit=dev --audit-level=high
      - name: 运行前端质量门
        run: pnpm quality:frontend

  # Playwright 全量端到端：运行全部 Ubuntu 可执行用例，零重试并自动阻断未解释跳过。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Go（按 go.mod 版本）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 安装并校验 ffmpeg/ffprobe（真实媒体用例依赖）
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装根工作区依赖
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: 安装前端依赖（webServer 构建前端用）
        run: npm --prefix frontend install
      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps chromium
      - name: 运行端到端质量门
        run: pnpm quality:e2e
