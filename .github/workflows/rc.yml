# RC 仅允许从 main 手动发布；VERSION 必须直接包含 rc 序号。
name: 发布候选版本

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: 校验 RC 发布元数据
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      artifact_prefix: ${{ steps.meta.outputs.artifact_prefix }}
    steps:
      - name: 拒绝非 main 手动运行
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: test "$REF_NAME" = "main" || { echo "错误：RC 只能从 main 分支手动运行。" >&2; exit 1; }
      - name: 检出固定源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: meta
        name: 读取并校验 RC 版本
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || { echo "错误：RC 的 VERSION 必须形如 X.Y.Z-rc.N。" >&2; exit 1; }
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=jianvideo-rc-${source_sha:0:7}" >> "$GITHUB_OUTPUT"
      - name: 预检 RC 序号与目标引用
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/publish-release.sh preflight-rc "${{ steps.meta.outputs.tag }}"
      - name: 校验 RC 发布说明
        shell: bash
        run: bash scripts/changelog-extract.sh "${{ steps.meta.outputs.version }}" CHANGELOG.md >/dev/null

  quality:
    name: 复用四项质量门
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}

  build:
    name: 构建固定 RC 源码
    needs: [prepare, quality]
    uses: ./.github/workflows/build.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      artifact_prefix: ${{ needs.prepare.outputs.artifact_prefix }}
      artifact_retention_days: 14

  publish:
    name: 安全发布 RC
    needs: [prepare, quality, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出发布脚本与变更日志
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - name: 下载全部平台工件
        uses: actions/download-artifact@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          pattern: ${{ needs.prepare.outputs.artifact_prefix }}-*
          path: artifacts
          merge-multiple: true
      - name: 生成 RC 发布说明
        shell: bash
        run: bash scripts/changelog-extract.sh "${{ needs.prepare.outputs.version }}" CHANGELOG.md > release-notes.md
      - name: 创建、校验并公开 RC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/publish-release.sh publish artifacts "${{ needs.prepare.outputs.tag }}" "${{ needs.prepare.outputs.source_sha }}" rc release-notes.md
