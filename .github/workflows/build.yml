# 可复用发布构建。调用方必须传入固定源码 SHA 与版本号。
name: 构建发布产物

on:
  workflow_call:
    inputs:
      source_sha:
        description: 固定构建的源码提交
        required: true
        type: string
      version:
        description: 注入二进制的版本号
        required: true
        type: string
      artifact_prefix:
        description: Actions 工件名称前缀
        required: true
        type: string
      artifact_retention_days:
        description: Actions 工件保留天数
        required: true
        type: number

permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ matrix.goos }}/amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            ext: ""
          - runner: windows-latest
            goos: windows
            ext: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出固定源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
      - name: 断言源码 SHA 未漂移
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: 安装 Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建内嵌前端
        run: |
          npm --prefix frontend install --no-audit --no-fund
          npm --prefix frontend run build
      - name: 编译单二进制
        shell: bash
        env:
          CGO_ENABLED: "1"
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          out="jianvideo-${{ matrix.goos }}-amd64${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION}" -o "dist/$out" .
          (cd dist && sha256sum "$out" > "jianvideo-${{ matrix.goos }}-amd64.sha256")
      - name: 上传固定源码构建工件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.goos }}-amd64
          path: dist/jianvideo-${{ matrix.goos }}-amd64*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
