# 可复用构建工作流：各平台原生 runner 编译单二进制（前端 go:embed + CGO + 版本注入）。
# 由 release.yml / prerelease.yml 经 workflow_call 复用，避免构建逻辑重复（见 ADR-0032）。
# 产出工件 dist-linux / dist-windows，含二进制与对应 sha256 校验和。
name: 构建产物（可复用）

on:
  workflow_call:
    inputs:
      version:
        description: 注入二进制的版本号（main.version）
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux 原生构建（linux/amd64）
          - os: ubuntu-latest
            goos: linux
            ext: ''
          # Windows 原生构建（windows/amd64）
          - os: windows-latest
            goos: windows
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Go（按 go.mod 版本）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建前端（供 go:embed 内嵌）
        # 用 npm install 而非 npm ci：package-lock 在 Windows 生成，缺 Linux 平台的可选依赖
        # （@emnapi/* 等 napi WASM 垫片），npm ci 的严格同步校验在 Linux runner 会失败；
        # npm install 按目标平台重新解析依赖，跨平台可靠（牺牲少量可复现性，可接受）。
        run: |
          npm --prefix frontend install --no-audit --no-fund
          npm --prefix frontend run build
      - name: 编译单二进制（CGO 原生 + 注入版本号）
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          out="jianvideo-${{ matrix.goos }}-amd64${{ matrix.ext }}"
          go build -ldflags "-s -w -X main.version=${{ inputs.version }}" -o "dist/$out" .
      - name: 计算 sha256 校验和
        shell: bash
        run: |
          cd dist
          sha256sum "jianvideo-${{ matrix.goos }}-amd64${{ matrix.ext }}" > "jianvideo-${{ matrix.goos }}-amd64.sha256"
      - name: 上传平台工件
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}
          path: dist/jianvideo-${{ matrix.goos }}-amd64*
