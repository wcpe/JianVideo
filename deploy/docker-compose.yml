# 单机部署编排。凭据经 .env 注入（.env 不入库，见 .env.example）。
# 用法：cp deploy/.env.example deploy/.env && 编辑 .env && docker compose -f deploy/docker-compose.yml up -d --build
services:
  jianvideo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: jianvideo:latest
    container_name: jianvideo
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - jianvideo-data:/data
    healthcheck:
      # 公开 /health，无需 JWT（FR2-072）
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  jianvideo-data:
