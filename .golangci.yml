# Go 静态检查门禁配置（golangci-lint v2）。
# 落地 .claude/rules/static-analysis.md 既定 Go 工具链，由 `make lint` 与 CI 调用（见 FR-122 / ADR-0047）。
# 注意：分析 main 包依赖 `//go:embed frontend/dist`，需先构建前端（CI 在 lint 前构建前端）。
version: "2"

run:
  # 大仓全量分析留足时间
  timeout: 5m

linters:
  # 在默认集基础上显式固定高价值检查器，避免不同版本默认集漂移
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - sqlclosecheck
    - staticcheck
    - unparam
    - unused
  exclusions:
    # 前端依赖目录非本仓 Go 源码（不入库的第三方生成代码），不纳入静态检查
    paths:
      - frontend/node_modules
    rules:
      # 测试辅助代码会刻意构造不完整 Cookie、临时文件权限和固定参数；安全门禁聚焦生产路径
      - path: _test\.go
        linters:
          - gosec
          - unparam
      # dHash 按位保存到 int64 字段，读取时需要按原始 64 位恢复，非数值意义转换
      - path: internal/library/dedup\.go
        linters:
          - gosec
        text: "G115:"
      # 外部媒体工具由配置解析与固定参数构造约束，保留集中说明，不在代码内散落 nolint
      - path: internal/library/(imageconvert|metadata|thumbnail)\.go
        linters:
          - gosec
        text: "G204:"
      - path: internal/library/(metadata|upload)\.go
        linters:
          - gosec
        text: "G304:"
      # 内嵌元数据解析只执行配置解析后的 ffprobe，输入路径来自已入库媒体记录
      - path: internal/library/embedded_metadata_parser\.go
        linters:
          - gosec
        text: "G204:"
      # 图片内嵌元数据只读取已入库媒体文件，调用入口已绑定媒体记录
      - path: internal/library/image_embedded_metadata\.go
        linters:
          - gosec
        text: "G304:"
      - path: internal/transcoder/(codec|encoder_probe)\.go
        linters:
          - gosec
        text: "G204:"
      - path: internal/transcoder/pipeline\.go
        linters:
          - gosec
        text: "G204:"
      - path: internal/transcoder/subtitle\.go
        linters:
          - gosec
        text: "G304:"
      # 能力服务只读取配置解析后的 FFmpeg 可执行文件，用于本地身份摘要
      - path: internal/transcoder/capability_service\.go
        linters:
          - gosec
        text: "G304:"
      # ABR 与 HLS 清单只写入经过 profile 路径校验的应用私有输出目录
      - path: internal/transcoder/(abr_pipeline|hls_pre_slice)\.go
        linters:
          - gosec
        text: "G306:"
      # HLS 文件只在应用私有 HLS 根目录下按 mediaID/档位读写，由路由层做路径清理
      - path: internal/player/(hls|hls_manager)\.go
        linters:
          - gosec
        text: "G(304|306):"
      # dHash 只读取本应用生成的缩略图缓存路径
      - path: internal/library/dhash\.go
        linters:
          - gosec
        text: "G304:"
      # 播放服务只打开已入库媒体路径，访问入口已过鉴权与媒体记录查找
      - path: internal/playback/service\.go
        linters:
          - gosec
        text: "G304:"
      # SMB 密码仅在 smb 包内序列化后立即加密落盘，不作为 HTTP 明文响应
      - path: internal/smb/credentials\.go
        linters:
          - gosec
        text: "G(117|304):"
      # 自更新必须给新二进制可执行权限，且目标路径来自当前可执行文件或已校验资产
      - path: internal/update/(apply|asset|download)\.go
        linters:
          - gosec
        text: "G(204|302|304|702):"
      # 转码模块必须调用 ffmpeg/ffprobe，路径来源由配置解析与可用性探测约束
      - path: internal/transcoder/(fmp4|hls_pre_slice|multi_pipeline)\.go
        linters:
          - gosec
        text: "G204:"

formatters:
  # 格式化检查（gofmt/goimports），由 `golangci-lint fmt` 应用、`run` 报告
  enable:
    - gofmt
    - goimports
