# Go 静态检查门禁配置（golangci-lint v2）。
# 落地 .claude/rules/static-analysis.md 既定 Go 工具链，由 `make lint` 与 CI 调用（见 FR-122 / ADR-0047）。
# 注意：分析 main 包依赖 `//go:embed frontend/dist`，需先构建前端（CI 在 lint 前构建前端）。
version: "2"

run:
  # 大仓全量分析留足时间
  timeout: 5m

linters:
  # 在默认集（errcheck/govet/ineffassign/staticcheck/unused）之上补齐高价值检查器
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - revive
    - sqlclosecheck
    - staticcheck
  exclusions:
    # 前端依赖目录非本仓 Go 源码（不入库的第三方生成代码），不纳入静态检查
    paths:
      - frontend/node_modules

formatters:
  # 格式化检查（gofmt/goimports），由 `golangci-lint fmt` 应用、`run` 报告
  enable:
    - gofmt
    - goimports
